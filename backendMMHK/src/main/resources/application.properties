# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/HMMK_db
spring.datasource.username=postgres
spring.datasource.password=Hamza2004
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true



# Configuration CORS globale (optionnel)
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
spring.web.cors.allowed-headers=*

# Logging pour debug
logging.level.com.mmhk.delivery=DEBUG


# Server Configuration
server.port=8080
server.servlet.context-path=/api

# CORS Configuration (pour React)
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# JWT Configuration
jwt.secret=HamzaSecretKey1234567890ForJWTTokenGenerationInMMHKProject
jwt.expiration=86400000 # 24h en ms

# Logging
logging.level.com.mmhk=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
# Exécuter data.sql au démarrage
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
# Désactivez la base de données TEMPORAIREMENT pour tester

logging.level.root=INFO
