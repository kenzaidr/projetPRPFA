<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grab Morocco</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
            fontFamily: {
              inter: ['Inter', 'sans-serif'],
            },
                    colors: {
              morocco: {
                red: '#C1272D',
                green: '#006233',
                gold: '#D4AF37',
                sand: '#F2E8C9',
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'float-delayed': 'float 6s ease-in-out 3s infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Global patterns */
      .moroccan-pattern {
        background-color: transparent;
        background-image: radial-gradient(#C1272D 2px, transparent 2px), radial-gradient(#006233 2px, transparent 2px);
        background-size: 30px 30px;
        background-position: 0 0, 15px 15px;
        opacity: 0.1;
      }
      .moroccan-pattern-white {
        background-color: transparent;
        background-image: radial-gradient(#ffffff 2px, transparent 2px), radial-gradient(#ffffff 2px, transparent 2px);
        background-size: 30px 30px;
        background-position: 0 0, 15px 15px;
        opacity: 0.2;
      }
    </style>
